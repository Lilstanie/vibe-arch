<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recruit Copilot</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <nav class="nav">
      <div class="brand">
        <div class="logo">R</div>
        <div class="t">Recruit Copilot<small>猎头 AI 工作台</small></div>
      </div>
      <a class="item" href="#/dashboard" title="概览"><span class="ic">🏠</span><span class="lbl">概览</span></a>
      <a class="item" href="#/chat" title="AI 对话"><span class="ic">💬</span><span class="lbl">AI 对话</span></a>
      <a class="item" href="#/jd" title="岗位分析"><span class="ic">📋</span><span class="lbl">岗位分析</span></a>
      <a class="item" href="#/sourcing" title="智能寻访"><span class="ic">🧭</span><span class="lbl">智能寻访</span></a>
      <a class="item" href="#/kanban" title="人才看板"><span class="ic">🗂️</span><span class="lbl">人才看板</span> <span class="count" id="navCandCount">0</span></a>
      <a class="item" href="#/screen" title="简历初筛"><span class="ic">📄</span><span class="lbl">简历初筛</span></a>
      <a class="item" href="#/activation" title="主动跟进"><span class="ic">🔔</span><span class="lbl">主动跟进</span> <span class="count" id="navFuCount">0</span></a>
      <a class="item" href="#/reminders" title="跟进提醒"><span class="ic">⏰</span><span class="lbl">跟进提醒</span> <span class="count" id="navRemCount">0</span></a>
      <a class="item" href="#/calls" title="通话纪要"><span class="ic">📞</span><span class="lbl">通话纪要</span></a>
      <div class="spacer"></div>
      <a class="item" href="/landing.html" style="font-size:12px;color:var(--muted)"><span class="ic">✨</span> 产品展示页 ↗</a>
      <div class="provider" id="providerBox"><span class="dot"></span>AI: <b id="providerName">…</b></div>
    </nav>

    <div class="main">
      <div class="topbar">
        <h1 id="pageTitle">概览</h1>
        <span class="sub" id="pageSub"></span>
        <div class="grow"></div>
        <span class="fpill" id="feishuPill" title="飞书多维表格同步状态"><span class="fs">飞</span><span id="feishuMode">…</span></span>
        <button class="btn sm" id="pullFeishuBtn" title="把飞书里改动的阶段/备注回流到本系统">↻ 拉取飞书</button>
        <button class="btn sm" id="resetBtn">重置示例数据</button>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="drawer" id="drawer"></div>
  <div class="toast-wrap" id="toastWrap"></div>

  <script src="/app.js"></script>
</body>
</html>
