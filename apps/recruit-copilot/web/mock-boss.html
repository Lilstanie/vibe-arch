<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mock Boss · 扩展联调</title>
<style>
  body{margin:0;font-family:-apple-system,"PingFang SC",sans-serif;background:#f0f2f5;color:#1f2328;}
  .bar{background:#fff;border-bottom:1px solid #ececec;padding:12px 24px;font-weight:800;color:#00a6a7;font-size:18px;display:flex;align-items:center;gap:10px;}
  .bar .mk{background:#00a6a7;color:#fff;border-radius:6px;padding:1px 7px;font-size:14px;}
  .bar .note{margin-left:auto;font-size:12px;font-weight:400;color:#9ca3af;}
  .wrap{max-width:720px;margin:22px auto;padding:0 20px 120px;}
  .card{background:#fff;border-radius:12px;padding:22px 24px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .name{font-size:22px;font-weight:700;margin:0;}
  .meta{color:#6b7280;font-size:13px;margin-top:8px;}
  .skills{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;}
  .skill{background:#e6f7f7;color:#008f90;font-size:12.5px;padding:5px 12px;border-radius:16px;}
  .exp{margin-top:16px;color:#4b5563;font-size:13px;line-height:1.7;}
  .exp b{color:#1f2328;}
  .chatbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ececec;padding:12px 24px;display:flex;gap:10px;}
  .chatbar textarea{flex:1;height:44px;border:1px solid #dcdfe3;border-radius:8px;padding:10px 14px;font-size:14px;font-family:inherit;resize:none;outline:none;}
  .chatbar textarea:focus{border-color:#00a6a7;}
  .chatbar button{background:#00a6a7;color:#fff;border:none;border-radius:8px;padding:0 24px;font-weight:600;cursor:pointer;}
  .switcher{margin-top:16px;font-size:12px;color:#9ca3af;}
  .switcher a{color:#4f46e5;cursor:pointer;text-decoration:underline;margin-right:10px;}
</style>
</head>
<body>
  <div class="bar"><span class="mk">B</span>BOSS直聘<span class="note">← 模拟页面，用于联调 Recruit Copilot 扩展（右下角面板）</span></div>
  <div class="wrap">
    <div class="card">
      <h1 class="name" data-rc-name>张伟</h1>
      <div class="meta">男 · 32岁 · 7年经验 · 本科 · 期望 上海·后端开发·35-45K</div>
      <div class="skills"><span class="skill">Java</span><span class="skill">分布式</span><span class="skill">高并发</span><span class="skill">RocketMQ</span></div>
      <div class="exp">主导<b>订单系统重构</b>，QPS 从 2k 提升至 12k；前司支付网关日均 800w 笔。</div>
      <div class="switcher">切换候选人（模拟不同页面）：
        <a data-set="张伟">张伟</a><a data-set="陈晨">陈晨</a><a data-set="王芳">王芳</a><a data-set="不存在的人">未入库者</a>
      </div>
    </div>
  </div>
  <div class="chatbar">
    <textarea data-rc-chat placeholder="给候选人发消息…（扩展会把 AI 开场白填到这里，等你确认发送）"></textarea>
    <button>发送</button>
  </div>

  <script>
    // switch the candidate name to exercise the extension against different people
    document.querySelectorAll("[data-set]").forEach((a) => {
      a.onclick = () => { document.querySelector("[data-rc-name]").textContent = a.getAttribute("data-set"); };
    });
  </script>
  <script src="/ext/content.js"></script>
</body>
</html>
